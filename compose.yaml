services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      BOT_DATABASE: /app/data/bot.sqlite3
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/google-service-account.json
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
